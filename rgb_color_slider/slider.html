<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>color-slider</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="wrapper">
        R<input
          type="range"
          min="0"
          max="255"
          value="0"
          id="red"
          oninput="colors()"
        />
      </div>
      <div class="wrapper">
        G<input
          type="range"
          min="0"
          max="255"
          value="0"
          id="green"
          oninput="colors()"
        />
      </div>
      <div class="wrapper">
        B<input
          type="range"
          min="0"
          max="255"
          value="0"
          id="blue"
          oninput="colors()"
        />
      </div>
      <span id="output">rgb(0, 0, 0)</span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
