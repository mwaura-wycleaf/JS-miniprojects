<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="controls">
            <button class="btn" id="resume"><i class="fa-solid fa-play"></i></button>
            <button class="btn" id="pause"><i class="fa-solid fa-pause"></i></button>
        </div>
        <textarea name="text" id="text" cols="30" rows="10" placeholder="Enter your text here..."></textarea>

        <button id ="submit" type="submit">Submit</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
