<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-app</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="search-section">
            <div class="input-wrapper">
                <span><i class="fa fa-search" aria-hidden="true"></i></span>
                <input type="search" placeholder="Enter a city" class="search-input">
            </div>
            <button class="location-button">
                <span><i class="fa-solid fa-location-dot"></i></span>
            </button>
        </div>

        <div class="weather-section">
            <div class="current-weather">
                <img src="icons/clouds.svg" class = "weather-icon">
                <h2 class = "temperature">20<span>°C</span></h2>
                <p class="description">Partly Cloudy</p>
            </div>

            <div class="hourly-weather">
                <ul class="weather-list">
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="icons/clouds.svg" class = "weather-icon">
                        <p class="temperature">20°</p>
                    </li>
                </ul>

                 <ul class="weather-list">
                    <li class="weather-item">

                    </li>
                </ul>

                 <ul class="weather-list">
                    <li class="weather-item">
                        <p class="time">00:00</p>

                        <p class="temperature">20°</p>
                    </li>
                </ul>

                 <ul class="weather-list">
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="icons/clouds.svg" class = "weather-icon">
                        <p class="temperature">20°</p>
                    </li>
                </ul>

                 <ul class="weather-list">
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="icons/clouds.svg" class = "weather-icon">
                        <p class="temperature">20°</p>
                    </li>
                </ul>

                 <ul class="weather-list">
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="icons/clouds.svg" class = "weather-icon">
                        <p class="temperature">20°</p>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
