<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather-app</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=location_home"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="search-section">
        <div class="input-wrapper">
          <span><i class="fa fa-search" aria-hidden="true"></i></span>
          <input
            type="search"
            placeholder="Enter a city"
            class="search-input"
          />
        </div>
        <button class="location-button">
          <span class="material-symbols-rounded"> location_home </span>
        </button>
      </div>

      <div class="weather-section">
        <div class="current-weather">
          <img src="icons/clouds.svg" class="weather-icon" />
          <h2 class="temperature">20<span>°C</span></h2>
          <p class="description">Partly Cloudy</p>
        </div>

        <div class="hourly-weather">
          <ul class="weather-list">
            <li class="weather-item">
              <p class="time">00:00</p>
              <img src="icons/clouds.svg" class="weather-icon" />
              <p class="temperature">20°</p>
            </li>
          </ul>

          <ul class="weather-list">
            <li class="weather-item">
              <p class="time">00:00</p>
              <img src="icons/clouds.svg" class="weather-icon" />
              <p class="temperature">20°</p>
            </li>
          </ul>

          <ul class="weather-list">
            <li class="weather-item">
              <p class="time">00:00</p>
              <img src="icons/clouds.svg" class="weather-icon" />
              <p class="temperature">20°</p>
            </li>
          </ul>

          <ul class="weather-list">
            <li class="weather-item">
              <p class="time">00:00</p>
              <img src="icons/clouds.svg" class="weather-icon" />
              <p class="temperature">20°</p>
            </li>
          </ul>

          <ul class="weather-list">
            <li class="weather-item">
              <p class="time">00:00</p>
              <img src="icons/clouds.svg" class="weather-icon" />
              <p class="temperature">20°</p>
            </li>
          </ul>

          <ul class="weather-list">
            <li class="weather-item">
              <p class="time">00:00</p>
              <img src="icons/clouds.svg" class="weather-icon" />
              <p class="temperature">20°</p>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
