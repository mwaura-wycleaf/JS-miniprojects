<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random-Password-Generator</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
   <div class="container">
    <input type="text" id="output">
    <button id="copy"><i class="fa-solid fa-random" onclick="genPassword()"></i></button>
    <button><i class="far fa-copy" onclick="copyClipboard()"></i></button>
    <input type="range" id="length" min="8" max="20" value="8" oninput="genPassword()">
    <h3 id="length-value">8</h3>
   </div>
    <script src="script.js">
        
    </script>
</body>
</html>
