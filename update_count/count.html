<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update-count</title>
</head>
<body>
    <p id="demo" style = "margin-left:100px; font-size:30px;"></p>
    <button id="start" style = "background-color: green; color: white; border: none; padding: 10px 20px; cursor: pointer;">Start count</button>
    <button id="reset" style = "background-color: red; color: white; border: none; padding: 10px 20px; cursor: pointer;">Reset</button>
    <button id="reduce" style = "background-color: blue; color: white; border: none; padding: 10px 20px; cursor: pointer;">Decreament</button>
    <button id="save" style="background-color: burlywood; border: none; padding: 10px 20px; cursor: pointer;">Save</button>
    <button id="load" style="background-color: rgb(135, 222, 145); border: none; padding: 10px 20px; cursor: pointer;">Load</button>
<script src="script.js"></script>
</body>
</html>
